<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title>Videos educativos · Lobby</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #02030a;
        overflow: hidden;
      }
      video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }
    </style>
  </head>
  <body>
    <video id="v" playsinline webkit-playsinline controls preload="auto"></video>
    <script>
      (function () {
        function parsePlaylist() {
          try {
            var hash = (location.hash || "").replace(/^#/, "");
            if (hash.indexOf("b64=") === 0) {
              var b64 = decodeURIComponent(hash.slice(4));
              var json = decodeURIComponent(escape(atob(b64)));
              var list = JSON.parse(json);
              return Array.isArray(list) ? list : [];
            }
            if (hash.indexOf("p=") === 0) {
              return JSON.parse(decodeURIComponent(hash.slice(2)));
            }
          } catch (e) {}
          return [];
        }

        var list = parsePlaylist().filter(function (item) {
          return item && typeof item.url === "string" && item.url.length > 8;
        });
        var index = 0;
        var video = document.getElementById("v");

        function load(autoplay) {
          if (!list.length || !video) return;
          var item = list[index % list.length];
          video.pause();
          video.src = item.url;
          video.load();
          if (autoplay) {
            var p = video.play();
            if (p && typeof p.catch === "function") p.catch(function () {});
          }
        }

        video.addEventListener("ended", function () {
          if (!list.length) return;
          index = (index + 1) % list.length;
          load(true);
        });

        load(false);
      })();
    </script>
  </body>
</html>
