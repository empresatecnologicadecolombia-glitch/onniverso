  <script>
    (function preloadHomeLcp() {
      try {
        var path = (location.pathname || "/").replace(/\\/g, "/");
        var isHome =
          path === "/" ||
          path === "" ||
          /\/index\.html$/i.test(path);
        if (!isHome) return;
        var link = document.createElement("link");
        link.rel = "preload";
        link.as = "image";
        link.href =
          "https://images.unsplash.com/photo-1577223625816-7546f13df25d?auto=format&fit=crop&w=1400&q=70";
        link.fetchPriority = "high";
        document.head.appendChild(link);
      } catch (_) {}
    })();
  </script>

<body>
  <script>
    (function blockVercelToolbar() {
      var BLOCK = "vercel.live";
      function sweep() {
        try {
          document
            .querySelectorAll(
              'script[src*="' + BLOCK + '"], iframe[src*="' + BLOCK + '"], link[href*="' + BLOCK + '"]',
            )
            .forEach(function (node) {
              node.remove();
            });
          document.querySelectorAll("button, [role='button']").forEach(function (el) {
            var label = (el.textContent || "").trim();
            if (label !== "Interaction Timing" && label.indexOf("Interaction Timing") !== 0) return;
            var host = el;
            for (var i = 0; i < 10 && host.parentElement; i++) {
              host = host.parentElement;
              var pos = window.getComputedStyle(host).position;
              if (pos === "fixed" || pos === "sticky" || host.id === "vercel-toolbar") {
                host.remove();
                return;
              }
            }
            el.remove();
          });
        } catch (_) {}
      }
      sweep();
      new MutationObserver(sweep).observe(document.documentElement, {
        childList: true,
        subtree: true,
      });
    })();
  </script>
  <div id="root">
    <div id="boot-fcp" aria-hidden="true">
      <strong>ONNIVERS</strong>
      <span>Educación con realidad virtual inmersiva</span>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    (function injectSeoForWebHost(){
      try {
        var host = (window.location && window.location.hostname || "").toLowerCase();
        if (host !== "onnivers.com" && host !== "www.onnivers.com") return;
        var canonical = document.createElement("link");
        canonical.rel = "canonical";
        canonical.href = "https://onnivers.com/";
        document.head.appendChild(canonical);
        var ogUrl = document.createElement("meta");
        ogUrl.setAttribute("property", "og:url");
        ogUrl.content = "https://onnivers.com/";
        document.head.appendChild(ogUrl);
        var robots = document.createElement("meta");
        robots.name = "robots";
        robots.content = "index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1";
        document.head.appendChild(robots);
        var ld = document.createElement("script");
        ld.type = "application/ld+json";
        ld.textContent = '{"@context":"https://schema.org","@type":"WebSite","name":"OnniVers","url":"https://onnivers.com/","description":"OnniVers es la plataforma de educación inmersiva: aulas virtuales 360°, Coliseo inmersivo y clases en vivo donde el docente conduce la sesión y los estudiantes aprenden en tiempo real desde web o app.","inLanguage":"es"}';
        document.head.appendChild(ld);
      } catch (_) { /* offline / restricted host: no SEO injection */ }
    })();
  </script>
</body>
